name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Lint with ruff
      run: uv run ruff check --show-fixes
    - name: Format check with ruff
      run: uv run ruff format --check
    - name: Type check with ty
      run: uv run ty check model2data/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Run tests
      run: uv run pytest --cov=model2data --cov-report=xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # Continuously proves pyproject.toml's dbt-core>=1.11 floor claim stays
  # true (not just checked once by hand), while also exercising the newest
  # resolvable dbt-core. The floor tracks dbt's own support policy: 1.11 is
  # the oldest minor still receiving support from dbt Labs. Runs a real
  # generate -> deps -> build cycle against both ends of the supported range,
  # using a bare `dbt build` on a fresh database so the seed-before-model
  # ordering stays covered too.
  dbt-core-floor-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dbt-version: ["floor", "latest"]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Pin dbt-core/dbt-duckdb to the stated floor
      if: matrix.dbt-version == 'floor'
      run: uv pip install "dbt-core~=1.11.0" "dbt-duckdb~=1.11.0"
    - name: Generate a project from examples/hackernews.dbml
      run: uv run model2data --file examples/hackernews.dbml --rows 50 --seed 1 --name floor_ci
    - name: dbt deps
      working-directory: dbt_floor_ci
      run: uv run dbt deps --profiles-dir .
    - name: dbt build
      working-directory: dbt_floor_ci
      run: uv run dbt build --profiles-dir .

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Install dependencies
      run: uv sync --extra dev --extra postgres
    - name: Generate a project targeting Postgres
      run: >
        uv run model2data --file examples/hackernews.dbml --rows 50 --seed 1
        --adapter postgres --name pg_ci
      env:
        MODEL2DATA_PG_HOST: localhost
        MODEL2DATA_PG_PORT: "5432"
        MODEL2DATA_PG_USER: postgres
        MODEL2DATA_PG_PASSWORD: postgres
        MODEL2DATA_PG_DATABASE: postgres
    - name: dbt seed
      working-directory: dbt_pg_ci
      run: uv run dbt seed --profiles-dir .
      env:
        MODEL2DATA_PG_HOST: localhost
        MODEL2DATA_PG_PORT: "5432"
        MODEL2DATA_PG_USER: postgres
        MODEL2DATA_PG_PASSWORD: postgres
        MODEL2DATA_PG_DATABASE: postgres
    - name: dbt run
      working-directory: dbt_pg_ci
      run: uv run dbt run --profiles-dir .
      env:
        MODEL2DATA_PG_HOST: localhost
        MODEL2DATA_PG_PORT: "5432"
        MODEL2DATA_PG_USER: postgres
        MODEL2DATA_PG_PASSWORD: postgres
        MODEL2DATA_PG_DATABASE: postgres
