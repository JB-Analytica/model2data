[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model2data"
version = "1.2.0"
description = "Generate analytics-ready datasets from DBML models"
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JB Analytica" }]
keywords = [
    "dbt",
    "dbml",
    "synthetic-data",
    "test-data",
    "analytics-engineering",
    "data-engineering",
    "duckdb",
    "seed-data",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "dbt-core>=1.11",
    "dbt-duckdb>=1.11",
    "faker>=37.12.0",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "typer>=0.20.0",
]

[project.optional-dependencies]
postgres = [
  "dbt-postgres>=1.11",
]
dev = [
  "pytest",
  "pytest-cov",
  "pre-commit",
  "ruff>=0.1.0",
  "ty>=0.0.4",
  "types-pyyaml",
  "poethepoet>=0.38.0",
]

[project.urls]
Homepage = "https://github.com/JB-Analytica/model2data"
Repository = "https://github.com/JB-Analytica/model2data"
Issues = "https://github.com/JB-Analytica/model2data/issues"
Changelog = "https://github.com/JB-Analytica/model2data/blob/main/CHANGELOG.md"

[project.scripts]
model2data = "model2data.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["model2data*"]

[tool.setuptools.package-data]
model2data = [
    "dbt/templates/**/*",
    "examples/**/*",
]

# Ruff configuration (fast Python linter)
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "C901",  # complexity (handled with noqa when needed)
]

[tool.ruff.lint.isort]
known-first-party = ["model2data"]

# ty configuration (type checker)
[tool.ty]

# Poe the Poet task runner
[tool.poe.tasks]
lint = "ruff check ."
fix = "ruff check . --fix --exit-zero"
type = "ty check"
test-quick = "pytest -q --no-header -p no:warnings --no-cov"
check = ["fix", "lint", "type", "test-quick"]
