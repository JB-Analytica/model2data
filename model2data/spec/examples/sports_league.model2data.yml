# yaml-language-server: $schema=https://www.jbanalytica.com/model2data/spec/0.9.0/model.schema.json
model2data: 0.9.0
name: sports_league
description: >
  One season of a twelve-club league: the clubs, their players and every game, each club playing
  every other home and away. All club names are fictional.

enums:
  # A closed set, so an enum rather than a generator: with `unique` below, one row per member.
  club_name:
    [Harbour Rovers, Ironbridge United, Kestrel Athletic, Lakeside Town, Marlow Wanderers, Northgate City, Oakfield Albion, Pinewood Rangers, Queensmere FC, Redcliff Dynamo, Stonebridge Wolves, Westvale Harriers]
  game_status: [scheduled, final]
  position: [goalkeeper, defender, midfielder, forward]

tables:
  clubs:
    description: One row per club; twelve, because the enum has twelve members
    columns:
      id: {type: bigint, pk: true}
      name: {type: club_name, unique: true, not_null: true}   # unique enum: capped at 12 rows

  players:
    description: The squads
    columns:
      id: {type: bigint, pk: true}
      club_id:
        type: bigint
        not_null: true
        references: clubs.id
        generate: {at_least: 18, at_most: 25}   # every club has a squad of 18 to 25
      first_name: {type: first_name, not_null: true}   # people come from the run's locale
      last_name: {type: last_name, not_null: true}
      position:
        type: position
        not_null: true
        generate: {weights: {defender: 6, midfielder: 6, forward: 4, goalkeeper: 2}}

  games:
    description: One row per fixture; every club plays every other club home and away
    # 12 x 12 - 12 = 132 rows: no random draw could promise each pair exactly once
    combinations: [home_team_id, away_team_id]
    rules:
      - {home_team_id: {ne: {column: away_team_id}}}   # a club never plays itself
    columns:
      id: {type: bigint, pk: true}
      home_team_id: {type: bigint, references: clubs.id}
      away_team_id: {type: bigint, references: clubs.id}
      tip_off_at:
        type: timestamp
        not_null: true
        generate:
          # a season that runs past the run's day, so part of it is still to be played
          min: "2026-08-15"
          max: "2027-05-15"
          days: {fri: 1, sat: 3, sun: 3}                # weekend fixtures, a few on Friday night
          times: {"16:00": 1, "18:30": 1, "20:45": 2}   # three kick-off slots, the evening busiest
      game_date:
        type: date
        generate: {derive: {date_of: tip_off_at}}
      status:
        type: game_status
        not_null: true
        generate:
          derive:                         # played once the run's day has reached the tip-off
            cases:
              - if: {tip_off_at: {lte: {run: as_of}}}
                then: final
            else: scheduled
      # Goals are counts, so Poisson: 1.5 at home and 1.2 away is about 2.7 a game and a
      # draw in about one game in four. Played games only.
      home_score:
        type: int
        generate: {distribution: {kind: poisson, mean: 1.5}, max: 9, when: {status: [final]}}
      away_score:
        type: int
        generate: {distribution: {kind: poisson, mean: 1.2}, max: 9, when: {status: [final]}}
      winner_team_id:
        type: bigint
        references: clubs.id
        generate:
          when: {status: [final]}
          derive:                         # the side with more goals; a draw has no winner
            cases:
              - if: {home_score: {gt: {column: away_score}}}
                then: {column: home_team_id}
              - if: {away_score: {gt: {column: home_score}}}
                then: {column: away_team_id}
      result_posted_at:
        type: timestamp
        generate: {after: tip_off_at, when: {status: [final]}}   # a result follows its game

run:
  seed: 42
  as_of: "2026-12-01"
  locale: nl_BE
  rows_per_table: {clubs: 12, players: 260}
